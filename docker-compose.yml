services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: elite
      POSTGRES_PASSWORD: elite
      POSTGRES_DB: elite_kicks
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
volumes:
  pgdata:
# then set DATABASE_URL=postgres://elite:elite@localhost:5432/elite_kicks
