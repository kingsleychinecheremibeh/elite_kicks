<!doctype html>
<html lang="en" class="no-js">
<head>
  <title>Book Your Order — Elite Kicks</title>
  <meta name="description" content="Book your kits for delivery or store pickup. We confirm by phone before you pay.">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b1220">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Oswald:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/main.css">
</head>
<body data-page="booking">
<main id="main">
  <section class="hero hero--short" style="min-height:52svh">
    <div class="hero-media" id="hero-media"></div>
    <div class="container">
      <div class="hero-content">
        <span class="eyebrow">Book your order</span>
        <h1>Almost <span class="accent">match ready.</span></h1>
        <p>Tell us where and when. We'll call to confirm sizes and stock, and you pay only after confirming.</p>
      </div>
    </div>
  </section>

  <section class="container" style="margin-top:-40px;position:relative">
    <div class="booking-layout" id="layout">
      <form class="panel stack" id="form" novalidate>
        <h2 style="font-size:1.8rem;margin:0">Your details</h2>
        <div class="form-alert" id="alert" role="alert"></div>
        <div class="row">
          <div class="field"><label for="full_name">Full name</label><input class="input" id="full_name" name="full_name" autocomplete="name" required minlength="2" maxlength="80"><span class="error"></span></div>
          <div class="field"><label for="phone">Phone</label><input class="input" id="phone" name="phone" type="tel" autocomplete="tel" placeholder="+234 801 234 5678" required pattern="\+?[0-9\s\-]{7,20}"><span class="error"></span></div>
        </div>
        <div class="field"><label for="email">Email</label><input class="input" id="email" name="email" type="email" autocomplete="email" required><span class="error"></span></div>

        <h3 style="margin:8px 0 0">Delivery</h3>
        <div class="segmented">
          <label><input type="radio" name="delivery_method" value="delivery" checked><span><strong>Home delivery</strong><small>+₦2,500 · 48h in Lagos</small></span></label>
          <label><input type="radio" name="delivery_method" value="pickup"><span><strong>Store pickup</strong><small>Free · Lekki Phase 1</small></span></label>
        </div>
        <div class="field" id="address-field"><label for="address">Delivery address</label><textarea class="input" id="address" name="address" rows="2" autocomplete="street-address" maxlength="240"></textarea><span class="error"></span></div>
        <div class="row">
          <div class="field"><label for="preferred_date">Preferred date</label><input class="input" id="preferred_date" name="preferred_date" type="date" required><span class="error"></span></div>
          <div class="field"><label for="preferred_time_slot">Time slot</label>
            <select class="input" id="preferred_time_slot" name="preferred_time_slot"><option>09:00–12:00</option><option>12:00–15:00</option><option>15:00–18:00</option></select><span class="error"></span></div>
        </div>
        <div class="field"><label for="notes">Notes <span class="muted">(optional)</span></label><textarea class="input" id="notes" name="notes" rows="3" maxlength="500" placeholder="Team order? List names and numbers here."></textarea></div>
        <button class="btn btn-primary btn-block" id="submit">Confirm booking</button>
        <p class="muted" style="font-size:.85rem;margin:0;text-align:center">No payment is taken now. We'll call you within 2 working hours.</p>
      </form>

      <aside class="panel summary">
        <div class="ball-mini" id="ball" aria-hidden="true"></div>
        <h2 style="font-size:1.5rem">Order summary</h2>
        <div id="items"></div>
        <div class="totals">
          <div><span>Subtotal</span><span id="sub">₦0</span></div>
          <div><span>Delivery</span><span id="ship">₦0</span></div>
          <div class="grand"><span>Total</span><span id="total">₦0</span></div>
        </div>
      </aside>
    </div>
  </section>
</main>
<script type="module" src="/js/pages/booking.js"></script>
</body>
</html>
